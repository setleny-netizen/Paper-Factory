<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            /* ===== ЗАЩИТА: запрет выделения текста ===== */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* запрет меню долгого тапа на iOS */
        }

        body {
            background-color: #020617;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* ================= CANVAS ДЛЯ СНЕГА ================= */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a0d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 200, 255, 0.4);
            position: relative;
            padding-left: 15px;
        }

        .image-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 200, 255, 0.3));
            border-radius: 20px;

            /* ===== ЗАЩИТА: картинку нельзя перетащить или выделить ===== */
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 22px;
            border: 1px solid rgba(0, 204, 255, 0.6);
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.04);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3), inset 0 0 15px rgba(0, 204, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            background: linear-gradient(
                90deg,
                #0055aa 0%,
                #0099dd 50%,
                #00ccff 100%
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.7);
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%
            );
            filter: blur(2px);
            animation: scan 1.5s linear infinite;
        }

        @keyframes scan {
            0%   { transform: translateX(-30px); }
            100% { transform: translateX(550px); }
        }

        .progress-bar.frozen {
            box-shadow: 0 0 30px rgba(0, 204, 255, 1), 0 0 60px rgba(0, 204, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- СНЕГ РИСУЕТСЯ НА CANVAS -->
    <canvas id="snowCanvas"></canvas>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">Soon...</div>

        <div class="image-container">
            <!-- draggable="false" — запрет перетаскивания картинки -->
            <img src="b502f50c-cfbf-4b24-aad2-f2f5a8ce0649.png"
                 alt="Санта с елкой"
                 draggable="false">
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        /* =============== ЗАЩИТА ОТ КОПИРОВАНИЯ =============== */

        // 1. Запрет правого клика (контекстное меню)
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });

        // 2. Запрет копирования, вырезания, вставки
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('cut', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => e.preventDefault());

        // 3. Запрет выделения (на всякий случай, если CSS не сработал)
        document.addEventListener('selectstart', (e) => {
            e.preventDefault();
            return false;
        });

        // 4. Запрет перетаскивания любых элементов
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
            return false;
        });

        // 5. Запрет горячих клавиш: F12, Ctrl+C, Ctrl+A, Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        document.addEventListener('keydown', (e) => {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }

            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (DevTools)
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }

            // Ctrl+C / Ctrl+A / Ctrl+U / Ctrl+S / Ctrl+P
            if (e.ctrlKey && ['C', 'A', 'U', 'S', 'P'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }

            // Cmd (Mac): Cmd+C, Cmd+A, Cmd+U, Cmd+S
            if (e.metaKey && ['C', 'A', 'U', 'S', 'P'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }
        });

        // 6. Запрет выделения на мобильных при долгом тапе
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return; // разрешаем мультитач (зум двумя пальцами)
        }, { passive: true });

        /* ====================================================== */

        /* =============== СНЕГ НА CANVAS =============== */
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let snowflakes = [];
        const SNOW_COUNT = 350;

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Snowflake {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = Math.random() * W;
                this.y = randomY ? Math.random() * H : -10;
                this.size = Math.random() * 2.5 + 1;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.opacity = Math.random() * 0.5 + 0.4;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.wobble) * 0.5;

                if (this.y > H + 10 || this.x < -10 || this.x > W + 10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < SNOW_COUNT; i++) {
            snowflakes.push(new Snowflake());
        }

        function animateSnow() {
            ctx.clearRect(0, 0, W, H);
            for (let flake of snowflakes) {
                flake.update();
                flake.draw();
            }
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        /* =============== ПРОГРЕСС-БАР =============== */
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                if (progress >= 83) {
                    progress = 83;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '83%';
                    progressBar.style.width = '83%';
                    progressBar.classList.add('frozen');
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>
</html>

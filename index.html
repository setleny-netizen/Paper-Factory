            10%  { opacity: 0.9; }
            50%  { transform: translateY(50vh) translateX(10px); }

        /* --- НОВЫЙ ПРОГРЕСС-БАР (градиент + сканирующая линия) --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 22px;
            border: 1px solid rgba(0, 204, 255, 0.6);
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.04);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3), inset 0 0 15px rgba(0, 204, 255, 0.1);
            overflow: hidden;
        }

        /* Заливка — плавный градиент от тёмно-синего к голубому */
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            background: linear-gradient(
                90deg,
                #0055aa 0%,
                #0099dd 50%,
                #00ccff 100%
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.7);
            overflow: hidden;
        }

        /* Сканирующая вертикальная линия, бесконечно бегущая по бару */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%
            );
            filter: blur(2px);
            animation: scan 1.5s linear infinite;
        }

        @keyframes scan {
            0%   { transform: translateX(-30px); }
            100% { transform: translateX(550px); }
        }

        /* Остановка на 83% — сканирующая линия замирает, свечение пульсирует */
        .progress-bar.frozen {
            box-shadow: 0 0 30px rgba(0, 204, 255, 1), 0 0 60px rgba(0, 204, 255, 0.5);
        }

        .progress-bar.frozen::after {
            animation-play-state: paused;
            opacity: 0.3;
        }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                if (progress >= 83) {
                    progress = 83;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '83%';
                    progressBar.style.width = '83%';
                    progressBar.classList.add('frozen');
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

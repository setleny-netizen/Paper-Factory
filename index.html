<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050914; /* Очень темный синий, как на референсе */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* ================= АНИМАЦИЯ СНЕГА ================= */
        .snow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #ffffff;
            font-size: 1.2rem;
            opacity: 0.6;
            animation: fall linear infinite;
            text-shadow: 0 0 8px rgba(0, 200, 255, 0.8); /* Голубое свечение снежинок */
        }

        .snowflake:nth-child(1) { left: 10%; animation-duration: 6s; font-size: 1rem; animation-delay: 0s; }
        .snowflake:nth-child(2) { left: 25%; animation-duration: 9s; font-size: 1.8rem; animation-delay: 1s; }
        .snowflake:nth-child(3) { left: 35%; animation-duration: 7s; font-size: 1.2rem; animation-delay: 2s; }
        .snowflake:nth-child(4) { left: 45%; animation-duration: 10s; font-size: 2rem; animation-delay: 0.5s; }
        .snowflake:nth-child(5) { left: 55%; animation-duration: 8s; font-size: 1.5rem; animation-delay: 3s; }
        .snowflake:nth-child(6) { left: 65%; animation-duration: 5.5s; font-size: 1.1rem; animation-delay: 1.5s; }
        .snowflake:nth-child(7) { left: 75%; animation-duration: 9.5s; font-size: 1.9rem; animation-delay: 2.5s; }
        .snowflake:nth-child(8) { left: 85%; animation-duration: 7.5s; font-size: 1.3rem; animation-delay: 0.8s; }
        .snowflake:nth-child(9) { left: 95%; animation-duration: 8.5s; font-size: 1.6rem; animation-delay: 3.5s; }
        .snowflake:nth-child(10) { left: 5%; animation-duration: 11s; font-size: 2.2rem; animation-delay: 4s; }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        /* =================================================== */

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 15px;
            margin-bottom: 20px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
            opacity: 0.9;
        }

        .image-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 200, 255, 0.2));
            border-radius: 12px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- СТИЛЬ ПРОГРЕСС-БАРА (ПОЛОСКИ) --- */
        .progress-wrapper {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #4da6ff; /* Голубой цвет текста */
            text-transform: uppercase;
            font-weight: 600;
        }

        .progress-percent {
            font-size: 1rem;
            color: #00ccff;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.5);
        }

        /* Контейнер полосы с обводкой */
        .progress-container {
            width: 100%;
            height: 24px;
            border: 2px solid #00ccff; /* Голубая обводка */
            border-radius: 50px;
            padding: 3px;
            background-color: transparent;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.3), inset 0 0 10px rgba(0, 204, 255, 0.1);
            overflow: hidden;
        }

        /* Внутренняя полоса загрузки (создаем эффект полосок) */
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            /* Диагональные полоски */
            background: repeating-linear-gradient(
                45deg,
                #00ccff,
                #00ccff 8px,
                #0055aa 8px,
                #0055aa 16px
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.8);
            /* Анимация движения полосок */
            animation: moveStripes 1s linear infinite;
        }

        /* Анимация движения полосок внутри бара */
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 32px 0; } /* Сдвиг на длину одной полоски */
        }

        /* Эффект "зависания" — свечение пульсирует, полоски замирают */
        .progress-bar.frozen {
            animation: none; /* Останавливаем движение полосок */
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.9), 0 0 60px rgba(0, 204, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- СНЕГ НА ФОНЕ -->
    <div class="snow">
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">СКОРО...</div>

        <div class="image-container">
            <!-- ВАША КАРТИНКА -->
            <img src="f7b7542f-4a61-4b70-9434-8b62b9e2b025.png" alt="Санта с елкой">
        </div>

        <!-- ПРОГРЕСС-БАР -->
        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                // Случайный шаг, чтобы анимация была живой
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                // Если дошли до 80%
                if (progress >= 80) {
                    progress = 80;
                    clearInterval(intervalId); // Останавливаем загрузку
                    
                    // Обновляем финальные значения
                    progressPercent.innerText = '80%';
                    progressBar.style.width = '80%';
                    
                    // Добавляем класс "frozen" для красивого эффекта зависания
                    progressBar.classList.add('frozen');
                    return;
                }

                // Обновляем визуальную часть
                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>
</html>

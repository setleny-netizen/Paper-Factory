<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020617;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* ================= СНЕГ ================= */
        .snow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        /* Один универсальный стиль для всех снежинок */
        .snowflake {
            position: absolute;
            top: -20px;
            background: #ffffff;
            border-radius: 50%;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.9;
        }

        @keyframes fall {
            0%   { transform: translateY(-20px) translateX(0px); opacity: 0; }
            10%  { opacity: 0.9; }
            50%  { transform: translateY(50vh) translateX(10px); }
            90%  { opacity: 0.9; }
            100% { transform: translateY(105vh) translateX(-10px); opacity: 0; }
        }
        /* ========================================= */

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a0d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 200, 255, 0.4);
            position: relative;
            padding-left: 15px;
        }

        .image-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 200, 255, 0.3));
            border-radius: 20px;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 22px;
            border: 1px solid rgba(0, 204, 255, 0.6);
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.04);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3), inset 0 0 15px rgba(0, 204, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            background: linear-gradient(
                90deg,
                #0055aa 0%,
                #0099dd 50%,
                #00ccff 100%
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.7);
            overflow: hidden;
        }

        /* Блик — бежит всегда, даже после остановки на 83% */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%
            );
            filter: blur(2px);
            animation: scan 1.5s linear infinite;
        }

        @keyframes scan {
            0%   { transform: translateX(-30px); }
            100% { transform: translateX(550px); }
        }

        .progress-bar.frozen {
            box-shadow: 0 0 30px rgba(0, 204, 255, 1), 0 0 60px rgba(0, 204, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- СНЕГ (генерируется через JS) -->
    <div class="snow" id="snow"></div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">Soon...</div>

        <div class="image-container">
            <img src="b502f50c-cfbf-4b24-aad2-f2f5a8ce0649.png" alt="Санта с елкой">
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        /* =============== ГЕНЕРАЦИЯ СНЕГА (150 снежинок) =============== */
        document.addEventListener('DOMContentLoaded', () => {
            const snowContainer = document.getElementById('snow');
            const SNOW_COUNT = 350; // ← легко менять количество

            for (let i = 0; i < SNOW_COUNT; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');

                // Рандомные параметры
                const size     = Math.random() * 5 + 2;        // размер: 2–7px
                const left     = Math.random() * 100;          // позиция по ширине: 0–100%
                const duration = Math.random() * 9 + 7;        // скорость падения: 7–16s
                const delay    = Math.random() * 7;            // задержка старта: 0–7s

                flake.style.width = size + 'px';
                flake.style.height = size + 'px';
                flake.style.left = left + '%';
                flake.style.animationDuration = duration + 's';
                flake.style.animationDelay = delay + 's';

                snowContainer.appendChild(flake);
            }
        });

        /* =============== ПРОГРЕСС-БАР =============== */
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                // Остановка на 83%
                if (progress >= 83) {
                    progress = 83;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '83%';
                    progressBar.style.width = '83%';
                    progressBar.classList.add('frozen'); // Блик продолжает бежать
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>
</html>

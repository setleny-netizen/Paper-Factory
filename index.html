            box-sizing: border-box;

        body {
            background-color: #020617;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;

        /* ================= СНЕГ (60 снежинок, чистый белый, без свечения) ================= */
        .snow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            background: #ffffff;   /* просто белый */
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.9;
        }

        /* 60 снежинок — 1.5x от 40 */

        .snowflake:nth-child(57) { left: 78%; width: 5px; height: 5px; animation-duration: 13s;  animation-delay: 4.0s; }

        .snowflake:nth-child(59) { left: 96%; width: 6px; height: 6px; animation-duration: 12.5s;animation-delay: 3.6s; }
        .snowflake:nth-child(60) { left: 12%; width: 7px; height: 7px; animation-duration: 16s;  animation-delay: 5.6s; }

        @keyframes fall {
            0% {
                transform: translateY(-20px) translateX(0px);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            50% { transform: translateY(50vh) translateX(15px); }
            90% { opacity: 0.9; }
            100% {
                transform: translateY(105vh) translateX(-15px);
                opacity: 0;
            }
        }
        /* ============================================================ */

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a0d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 200, 255, 0.4);
            position: relative;
            padding-left: 15px;
        }

        .image-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Картинка теперь БЕЗ анимации — статичная */
        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 200, 255, 0.3));
            border-radius: 20px;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 28px;
            border: 2px solid #00ccff;
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.05);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.4), inset 0 0 15px rgba(0, 204, 255, 0.2);
            overflow: hidden;
        }

        /* Полоса: ТОЛЬКО диагональные двухцветные линии, бегущие вперёд */
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            background: repeating-linear-gradient(
                45deg,
                #00ccff,
                #00ccff 10px,
                #0055aa 10px,
                #0055aa 20px
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 25px rgba(0, 204, 255, 0.9);
            /* Бесконечное движение полосок вперёд */
            animation: moveStripes 0.8s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        /* Останавливаем на 83% — полоски замирают */
        .progress-bar.frozen {
            animation-play-state: paused;
            box-shadow: 0 0 40px rgba(0, 204, 255, 1), 0 0 80px rgba(0, 204, 255, 0.6);
        }

    </style>
</head>
<body>

    <!-- СНЕГ (60 снежинок) -->
    <div class="snow">
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>

        <div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">Soon...</div>

        <div class="image-container">
            <!-- ВАША КАРТИНКА (статичная) -->
            <img src="b502f50c-cfbf-4b24-aad2-f2f5a8ce0649.png" alt="Санта с елкой">
        </div>

        <!-- ПРОГРЕСС-БАР -->
        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                // Остановка на 83%
                if (progress >= 83) {
                    progress = 83;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '83%';
                    progressBar.style.width = '83%';
                    progressBar.classList.add('frozen'); // Полоски замирают
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020617; /* Глубокий темно-синий */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* ================= АНИМАЦИЯ СНЕГА ================= */
        .snow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: #ffffff;
            opacity: 0.7;
            animation: fall linear infinite;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.9), 0 0 20px rgba(0, 200, 255, 0.5);
            user-select: none;
        }

        /* Генерация 25 снежинок с разными параметрами */
        .snowflake:nth-child(1) { left: 3%; animation-duration: 8s; font-size: 0.8rem; animation-delay: 0s; }
        .snowflake:nth-child(2) { left: 8%; animation-duration: 12s; font-size: 1.5rem; animation-delay: 2s; }
        .snowflake:nth-child(3) { left: 15%; animation-duration: 6s; font-size: 1rem; animation-delay: 4s; }
        .snowflake:nth-child(4) { left: 22%; animation-duration: 14s; font-size: 2rem; animation-delay: 1s; }
        .snowflake:nth-child(5) { left: 28%; animation-duration: 9s; font-size: 0.9rem; animation-delay: 5s; }
        .snowflake:nth-child(6) { left: 35%; animation-duration: 11s; font-size: 1.3rem; animation-delay: 3s; }
        .snowflake:nth-child(7) { left: 42%; animation-duration: 7s; font-size: 1.7rem; animation-delay: 0.5s; }
        .snowflake:nth-child(8) { left: 48%; animation-duration: 13s; font-size: 0.7rem; animation-delay: 6s; }
        .snowflake:nth-child(9) { left: 55%; animation-duration: 10s; font-size: 1.4rem; animation-delay: 2.5s; }
        .snowflake:nth-child(10) { left: 62%; animation-duration: 15s; font-size: 2.2rem; animation-delay: 0.2s; }
        .snowflake:nth-child(11) { left: 68%; animation-duration: 8.5s; font-size: 1.1rem; animation-delay: 4.5s; }
        .snowflake:nth-child(12) { left: 75%; animation-duration: 12.5s; font-size: 0.6rem; animation-delay: 1.5s; }
        .snowflake:nth-child(13) { left: 82%; animation-duration: 7.5s; font-size: 1.8rem; animation-delay: 3.5s; }
        .snowflake:nth-child(14) { left: 88%; animation-duration: 11.5s; font-size: 1.2rem; animation-delay: 5.5s; }
        .snowflake:nth-child(15) { left: 94%; animation-duration: 9.5s; font-size: 0.9rem; animation-delay: 2.2s; }
        .snowflake:nth-child(16) { left: 12%; animation-duration: 16s; font-size: 2.5rem; animation-delay: 7s; }
        .snowflake:nth-child(17) { left: 38%; animation-duration: 6.5s; font-size: 0.8rem; animation-delay: 4.2s; }
        .snowflake:nth-child(18) { left: 58%; animation-duration: 13.5s; font-size: 1.6rem; animation-delay: 0.8s; }
        .snowflake:nth-child(19) { left: 72%; animation-duration: 10.5s; font-size: 1rem; animation-delay: 3.1s; }
        .snowflake:nth-child(20) { left: 85%; animation-duration: 8.8s; font-size: 1.9rem; animation-delay: 6.3s; }
        .snowflake:nth-child(21) { left: 18%; animation-duration: 14.5s; font-size: 0.7rem; animation-delay: 2.8s; }
        .snowflake:nth-child(22) { left: 45%; animation-duration: 7.2s; font-size: 1.4rem; animation-delay: 5.1s; }
        .snowflake:nth-child(23) { left: 65%; animation-duration: 11.1s; font-size: 0.9rem; animation-delay: 1.9s; }
        .snowflake:nth-child(24) { left: 78%; animation-duration: 9.3s; font-size: 2.1rem; animation-delay: 4.8s; }
        .snowflake:nth-child(25) { left: 92%; animation-duration: 15.5s; font-size: 1.3rem; animation-delay: 0.4s; }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        /* =================================================== */

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Стильная надпись "Скоро..." */
        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 20px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a0d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 200, 255, 0.4);
            position: relative;
            padding-left: 20px; /* Компенсация letter-spacing */
        }

        /* Добавляем свечение под текстом (эффект неона) */
        .title::after {
            content: 'СКОРО...';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            text-shadow: 0 0 40px rgba(0, 200, 255, 0.9), 0 0 80px rgba(0, 200, 255, 0.6);
            z-index: -1;
        }

        .image-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            /* Тень для картинки, чтобы выделялась на фоне */
            filter: drop-shadow(0 15px 35px rgba(0, 200, 255, 0.3));
            border-radius: 20px;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* --- СТИЛЬ ПРОГРЕСС-БАРА --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        /* Контейнер полосы с обводкой */
        .progress-container {
            width: 100%;
            height: 28px; /* Чуть выше для солидности */
            border: 2px solid #00ccff;
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.05); /* Легкий фон внутри */
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.4), inset 0 0 15px rgba(0, 204, 255, 0.2);
            overflow: hidden;
        }

        /* Внутренняя полоса загрузки (полоски + блик) */
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            /* Диагональные полоски */
            background: repeating-linear-gradient(
                45deg,
                #00ccff,
                #00ccff 10px,
                #0055aa 10px,
                #0055aa 20px
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 25px rgba(0, 204, 255, 0.9);
            animation: moveStripes 0.8s linear infinite;
            overflow: hidden;
        }

        /* Блик, который бежит по бару */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.8),
                transparent
            );
            animation: shine 2s infinite;
            border-radius: 50px;
        }

        /* Анимация движения полосок */
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        /* Анимация блика */
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        /* Эффект "зависания" */
        .progress-bar.frozen {
            animation-play-state: paused; /* Останавливаем полоски */
            box-shadow: 0 0 40px rgba(0, 204, 255, 1), 0 0 80px rgba(0, 204, 255, 0.6); /* Усиливаем свечение */
        }
        
        /* Останавливаем блик при зависании, но оставляем легкое свечение */
        .progress-bar.frozen::after {
            animation-play-state: paused;
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- СНЕГ НА ФОНЕ -->
    <div class="snow">
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">Скоро...</div>

        <div class="image-container">
            <!-- ВАША КАРТИНКА -->
            <img src="b502f50c-cfbf-4b24-aad2-f2f5a8ce0649.png" alt="Санта с елкой">
        </div>

        <!-- ПРОГРЕСС-БАР -->
        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                // Если дошли до 80%
                if (progress >= 80) {
                    progress = 80;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '80%';
                    progressBar.style.width = '80%';
                    progressBar.classList.add('frozen'); // Замирание с красивым свечением
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>
</html>

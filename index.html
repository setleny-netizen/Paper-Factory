<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020617;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* ================= CANVAS ДЛЯ СНЕГА ================= */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        /* ==================================================== */

        .content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a0d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 200, 255, 0.4);
            position: relative;
            padding-left: 15px;
        }

        .image-container {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .image-container img {
            max-width: 85vw;
            max-height: 45vh;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 200, 255, 0.3));
            border-radius: 20px;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-wrapper {
            width: 90%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4da6ff;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .progress-percent {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 200, 255, 0.9), 0 0 30px rgba(0, 200, 255, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 22px;
            border: 1px solid rgba(0, 204, 255, 0.6);
            border-radius: 50px;
            padding: 3px;
            background-color: rgba(0, 200, 255, 0.04);
            position: relative;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3), inset 0 0 15px rgba(0, 204, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 50px;
            position: relative;
            background: linear-gradient(
                90deg,
                #0055aa 0%,
                #0099dd 50%,
                #00ccff 100%
            );
            background-size: 200% 100%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.7);
            overflow: hidden;
        }

        /* Блик — бежит всегда */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.9) 50%,
                transparent 100%
            );
            filter: blur(2px);
            animation: scan 1.5s linear infinite;
        }

        @keyframes scan {
            0%   { transform: translateX(-30px); }
            100% { transform: translateX(550px); }
        }

        .progress-bar.frozen {
            box-shadow: 0 0 30px rgba(0, 204, 255, 1), 0 0 60px rgba(0, 204, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- СНЕГ РИСУЕТСЯ НА CANVAS -->
    <canvas id="snowCanvas"></canvas>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="title">Soon...</div>

        <div class="image-container">
            <img src="b502f50c-cfbf-4b24-aad2-f2f5a8ce0649.png" alt="Санта с елкой">
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span>LOADING...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        /* =============== СНЕГ НА CANVAS (плавно, до 1000+ снежинок) =============== */
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let snowflakes = [];
        const SNOW_COUNT = 350;  // ← можно ставить 500, 1000 — не будет лагать

        // Ресайз canvas под размер окна
        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Класс снежинки
        class Snowflake {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = Math.random() * W;
                this.y = randomY ? Math.random() * H : -10;
                this.size = Math.random() * 2.5 + 1;          // 1–3.5px (легче, чем div)
                this.speedY = Math.random() * 1.5 + 0.5;      // 0.5–2 px за кадр
                this.speedX = Math.random() * 0.6 - 0.3;      // лёгкое покачивание
                this.opacity = Math.random() * 0.5 + 0.4;     // 0.4–0.9
                this.wobble = Math.random() * Math.PI * 2;    // фаза для синусоиды
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.wobble) * 0.5;

                // Если улетела вниз или за край — возвращаем наверх (бесконечный поток)
                if (this.y > H + 10 || this.x < -10 || this.x > W + 10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Создаём снежинки
        for (let i = 0; i < SNOW_COUNT; i++) {
            snowflakes.push(new Snowflake());
        }

        // Анимация
        function animateSnow() {
            ctx.clearRect(0, 0, W, H);
            for (let flake of snowflakes) {
                flake.update();
                flake.draw();
            }
            requestAnimationFrame(animateSnow);
        }
        animateSnow();
        /* ======================================================================== */

        /* =============== ПРОГРЕСС-БАР =============== */
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            let progress = 0;

            const updateProgress = () => {
                const randomStep = Math.floor(Math.random() * 4) + 1;
                progress += randomStep;

                if (progress >= 83) {
                    progress = 83;
                    clearInterval(intervalId);
                    
                    progressPercent.innerText = '83%';
                    progressBar.style.width = '83%';
                    progressBar.classList.add('frozen');
                    return;
                }

                progressBar.style.width = progress + '%';
                progressPercent.innerText = progress + '%';
            };

            const intervalId = setInterval(updateProgress, 200);
        });
    </script>

</body>
</html>
